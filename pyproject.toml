[project]
name = "jev-bias"
version = "0.1.0"
description = "Does answer presentation affect Jev's judgment?"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
    "pandas",
    "numpy",
    "matplotlib",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_bias"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
